<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VELVET Partner</title>
  <style>
    :root { --ink:#1c1917; --cream:#faf7f2; --sand:#e7e0d5; --emerald:#0f5c4c; --danger:#9f1239; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif; background:linear-gradient(160deg,#f3eee6,#e8f2ef 50%,#f7f3ec); color:var(--ink); }
    main { max-width: 920px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { letter-spacing: .18em; font-weight: 600; }
    .card { background: rgba(255,255,255,.72); border:1px solid var(--sand); border-radius: 16px; padding: 1.25rem; margin-top: 1rem; }
    input, button { font: inherit; padding: .65rem .9rem; border-radius: 10px; border:1px solid var(--sand); }
    button { background: var(--emerald); color: var(--cream); border-color: var(--emerald); cursor: pointer; }
    button.secondary { background: transparent; color: var(--ink); }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
    table { width:100%; border-collapse: collapse; margin-top:1rem; }
    th, td { text-align:left; padding:.55rem .35rem; border-bottom:1px solid var(--sand); vertical-align:top; }
    .muted { color: rgba(28,25,23,.55); }
    .hidden { display:none; }
    #toast { position:fixed; right:1rem; bottom:1rem; background:var(--ink); color:var(--cream); padding:.75rem 1rem; border-radius:10px; display:none; }
    @media (max-width: 700px) {
      main { padding: 1.25rem 1rem 3rem; }
      table { display:block; overflow-x:auto; white-space:nowrap; }
    }
  </style>
</head>
<body>
<main>
  <h1>VELVET</h1>
  <p class="muted">Venue partner desk — booking ops for your assigned location.</p>

  <section id="login" class="card">
    <h2>Partner sign-in</h2>
    <div class="row">
      <input id="phone" placeholder="+251911000010" value="+251911000010" />
      <input id="invite" placeholder="Invite (new users only)" value="" />
      <button onclick="requestOtp()">Request OTP</button>
    </div>
    <div class="row" style="margin-top:.75rem">
      <input id="otp" placeholder="OTP" />
      <button onclick="verifyOtp()">Verify</button>
    </div>
    <p id="devOtp" class="muted"></p>
  </section>

  <section id="console" class="hidden">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2 id="venueName">Your venue</h2>
        <p id="venueMeta" class="muted"></p>
      </div>
      <button class="secondary" onclick="logout()">Sign out</button>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3>Upcoming / recent bookings</h3>
        <button class="secondary" onclick="loadBookings()">Refresh</button>
      </div>
      <table>
        <thead><tr><th>When</th><th>Status</th><th>Connection</th><th></th></tr></thead>
        <tbody id="bookingBody"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const API = location.origin;
// Do not persist a partner credential in browser storage.
let token = '';

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}

window.addEventListener('unhandledrejection', event => {
  const reason = event.reason;
  toast(reason instanceof Error ? reason.message : 'Something went wrong. Please try again.');
  event.preventDefault();
});

async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json', 'Accept': 'application/json' }, opts.headers || {});
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && data.message) || res.statusText);
  return data;
}

function showConsole(on) {
  document.getElementById('login').classList.toggle('hidden', on);
  document.getElementById('console').classList.toggle('hidden', !on);
}

async function requestOtp() {
  const phone = document.getElementById('phone').value.trim();
  const inviteCode = document.getElementById('invite').value.trim();
  const body = { phone, deviceId: 'partner-web', platform: 'web' };
  if (inviteCode) body.inviteCode = inviteCode;
  const data = await api('/v1/auth/otp/request', { method: 'POST', body: JSON.stringify(body) });
  document.getElementById('devOtp').textContent = data.devOtp ? ('Dev OTP: ' + data.devOtp) : 'OTP sent';
  if (data.devOtp) document.getElementById('otp').value = data.devOtp;
}

async function verifyOtp() {
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('otp').value.trim();
  const data = await api('/v1/auth/otp/verify', { method: 'POST', body: JSON.stringify({ phone, code, deviceId: 'partner-web', platform: 'web' }) });
  token = data.accessToken;
  if (data.user.role !== 'VENUE_PARTNER') {
    token = '';
    toast('This account has role ' + data.user.role + ' and cannot use the partner portal.');
    showConsole(false);
    return;
  }
  showConsole(true);
  await loadVenue();
  await loadBookings();
}

function logout() {
  token = '';
  showConsole(false);
}

async function loadVenue() {
  const v = await api('/v1/partner/venue');
  document.getElementById('venueName').textContent = v.name;
  document.getElementById('venueMeta').textContent = `${v.city} · ${v.category} · ${v.addressLine}`;
}

async function loadBookings() {
  const rows = await api('/v1/partner/bookings');
  document.getElementById('bookingBody').innerHTML = rows.map(b => `
    <tr>
      <td>${esc(b.startsAt)}</td>
      <td>${esc(b.status)}</td>
      <td><code>${(b.connectionId || b.matchId || '').slice(0,8)}</code></td>
      <td>${b.status === 'CONFIRMED' ? `<button onclick="deskCheckIn('${b.id}')">Desk check-in</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">No bookings</td></tr>';
}

async function deskCheckIn(id) {
  await api('/v1/partner/bookings/' + id + '/desk-check-in', { method: 'POST', body: '{}' });
  toast('Checked in');
  loadBookings();
}

</script>
</body>
</html>
